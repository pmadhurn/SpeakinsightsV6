port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  # Enable ICE lite for better NAT traversal with remote participants
  enable_loopback_candidate: true
  # Use ICE lite mode for server-side
  use_ice_lite: true

# Built-in TURN server — essential for remote participants behind NAT/firewalls
# Only UDP (no TLS since we don't have certs; Cloudflare handles TLS)
turn:
  enabled: true
  domain: mac.madhur.dev
  udp_port: 3478
  tls_port: 0

redis:
  address: redis:6379

