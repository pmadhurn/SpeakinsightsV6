# =============================================================================
# LiveKit Egress Configuration — SpeakInsights v3
# =============================================================================
# Credentials are provided via environment variables:
#   LIVEKIT_API_KEY, LIVEKIT_API_SECRET, LIVEKIT_WS_URL
# The egress binary reads these automatically — do NOT put them in this file
# because YAML does not perform shell-style variable substitution.

# Redis for job queue
redis:
  address: redis:6379

# Health check port
health_port: 9090

# File output configuration
file_output:
  local:
    directory: /app/storage/recordings

# Temp directory for processing
tmp_dir: /home/egress/tmp

# Logging
log_level: info
