# =============================================================================
# LiveKit Egress Configuration — SpeakInsights v3
# =============================================================================

# LiveKit server connection (Credentials provided via environment variables)
# LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET

# Redis for job queue
redis:
  address: redis:6379

# Health check port
health_port: 9090

# File output configuration
file_output:
  local:
    directory: /app/storage/recordings

# Temp directory for processing
tmp_dir: /home/egress/tmp

# Logging
log_level: info
