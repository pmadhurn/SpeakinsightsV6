    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector — Vector-enabled database
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: speakinsights-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-speakinsights}
      - POSTGRES_DB=speakinsights
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - speakinsights-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d speakinsights" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ---------------------------------------------------------------------------
  # Redis 7 — Cache & message queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: speakinsights-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - speakinsights-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.5"

  # ---------------------------------------------------------------------------
  # LiveKit Egress — Used to write LiveKit Cloud recordings to local disk
  # ---------------------------------------------------------------------------
  livekit-egress:
    image: livekit/egress:latest
    container_name: speakinsights-egress
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Use LiveKit Cloud endpoint and credentials directly
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
      - REDIS_URL=redis://redis:6379/0
      - LIVEKIT_URL=${LIVEKIT_URL:-wss://insighthub-hqk8ioh9.livekit.cloud}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - ./storage/recordings:/app/storage/recordings
    networks:
      - speakinsights-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  # ---------------------------------------------------------------------------
  # WhisperX — Speech-to-text transcription service
  # ---------------------------------------------------------------------------
  whisperx:
    build:
      context: ./whisperx-service
      dockerfile: Dockerfile
    container_name: speakinsights-whisperx
    ports:
      - "9000:9000"
    environment:
      # Model configuration
      - MODEL_SIZE=${WHISPERX_MODEL:-small}
      - DEVICE=cpu
      - COMPUTE_TYPE=int8
      - BATCH_SIZE=4
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-auto}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - whisperx-models:/root/.cache/huggingface
      - ./storage:/app/storage
    networks:
      - speakinsights-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"

# =============================================================================
# Networks
# =============================================================================
networks:
  speakinsights-net:
    driver: bridge
    name: speakinsights-net

# =============================================================================
# Volumes
# =============================================================================
volumes:
  # PostgreSQL persistent data
  postgres-data:
    name: speakinsights-postgres-data

  # Redis persistent data
  redis-data:
    name: speakinsights-redis-data

  # WhisperX model cache (avoid re-downloading)
  whisperx-models:
    name: speakinsights-whisperx-models
